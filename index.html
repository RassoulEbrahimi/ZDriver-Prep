<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4B3A8C" />
    <meta name="description" content="همراه آزمون رانندگی — آمادگی برای آزمون تئوری رانندگی" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>ZDriver Prep</title>
    <!-- Theme boot: set data-theme before first paint to avoid a flash (Phase 5C). -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('zd-theme');
          if (m !== 'light' && m !== 'dark' && m !== 'system') m = 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#16142A' : '#4B3A8C');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
